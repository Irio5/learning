{ t:"wf", q:"Su una lista di 500 lead, dove sta il rischio principale di un workflow agentico?", a:`<p><b>Un errore si moltiplica per 500: reputazione e deliverability</b></p><p>La scala amplifica gli errori: per questo contano freni (rate limit, suppression list) e approvazione umana più della pura velocità.</p>`},
{ t:"wf", q:"Perché qualificare (scoring) i lead PRIMA di generare le email?", a:`<p><b>Per generare solo per chi è in target: si risparmia costo e si protegge la reputazione</b></p><p>Il gate di qualifica scarta i fuori-target prima del lavoro costoso di scrittura: efficienza e meno spam.</p>`},
{ t:"wf", q:"Come si evita di inviare email personalizzate ma false?", a:`<p><b>Si vincola la bozza ai dati raccolti + auto-check + approvazione umana</b></p><p>Ancorare ai dati raccolti, un auto-check che ogni claim sia supportato, e un umano che approva prima dell'invio a freddo.</p>`},
{ t:"wf", q:"Audit automatizzato: agente libero o workflow?", a:`<p><b>Workflow con step agentici: i passi li definisce il dominio, l'LLM lavora dentro gli step — servono tracciabilità e riproducibilità</b></p><p>Un revisore deve poter difendere ogni conclusione e rieseguire il run con lo stesso esito: percorso prefissato e tracciato, con l'intelligenza del modello confinata nei singoli passi.</p>`},
{ t:"wf", q:"In Temporal, perché il codice del workflow deve essere deterministico?", a:`<p><b>Perché dopo un crash viene RI-ESEGUITO dalla event history: se prendesse strade diverse, il replay non ricostruirebbe lo stato</b></p><p>Il replay rigioca il codice alimentandolo coi risultati registrati: funziona solo se il codice ripercorre le stesse scelte. I side effect (I/O, LLM) vivono nelle activity, che al replay non si rifanno.</p>`},
{ t:"wf", q:"Come si implementa lo human-in-the-loop in un workflow Temporal?", a:`<p><b>Con un signal: il run resta in attesa (anche giorni) senza consumare risorse, e riparte quando l'auditor approva</b></p><p>Il signal è un messaggio verso un workflow in esecuzione: await condition(approved) sospende il run in modo durevole, e l'approvazione dalla UI lo risveglia esattamente dov'era.</p>`},
{ t:"wf", q:"Chi fa i calcoli in una pipeline documentale seria?", a:`<p><b>Codice deterministico: l'LLM estrae i valori (con citazione) e interpreta i risultati, ma somme, ratio e confronti con le soglie sono Python</b></p><p>Un LLM che fa i conti è un'allucinazione aritmetica in attesa di accadere; un check sum(righe)==totale in codice è giusto per sempre. Estrazione flessibile, aritmetica rigida.</p>`},
{ t:"sd", q:"Cosa significa progettare per «scaling orizzontale»?", a:`<p><b>Aggiungere più macchine intercambiabili dietro un load balancer</b></p><p>Orizzontale = più macchine (stateless, dietro un LB). Verticale = una macchina più grossa, che ha comunque un tetto fisico.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-metodo.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Perché gli app server devono essere «stateless»?", a:`<p><b>Per poterli aggiungere/togliere liberamente: sono intercambiabili</b></p><p>Se non tengono stato locale, qualsiasi server serve qualsiasi richiesta → li scali orizzontalmente. Lo stato va in DB/cache condivisi.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-metodo.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Picco 100.000 QPS, una macchina ne regge ~5.000. Cosa serve?", a:`<p><b>Load balancer + molte macchine + cache</b></p><p>Superato ciò che regge una macchina, la risposta è orizzontale: LB + tante macchine stateless + cache per le letture.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-stime.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Rapporto letture:scritture 100:1. Dove investi per primo?", a:`<p><b>Cache e read replica</b></p><p>Read-heavy → priorità alle letture: cache e repliche. Il sharding serve quando a soffrire sono scritture e storage.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-stime.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Aggiungi un nodo a un cluster che usa hash % N. Quante chiavi si rimescolano?", a:`<p><b>Quasi tutte</b></p><p>Cambiare N cambia il resto della divisione per quasi ogni chiave. Per questo si usa l'hashing coerente, che ne sposta solo ~1/N.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-dati.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Una read replica può restituire dati leggermente vecchi. Come si chiama?", a:`<p><b>Replica lag (eventual consistency)</b></p><p>La replica è aggiornata dal master con un piccolo ritardo: per un attimo le sue letture possono essere stantie.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-dati.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Un worker può ricevere lo stesso messaggio due volte (retry). Come eviti danni?", a:`<p><b>Rendendo l'elaborazione idempotente (chiave di deduplica)</b></p><p>Idempotenza: elaborare due volte deve avere lo stesso effetto di una (es. non addebitare 2×). Si usa una chiave di deduplica.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-async.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Il consumatore è più lento degli arrivi. Cosa succede e qual è la cura?", a:`<p><b>La coda cresce (backpressure); più worker in parallelo</b></p><p>Un burst breve si assorbe; se il ritardo dura, la coda si riempie. Si scala il consumatore aggiungendo worker in parallelo.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-async.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Read-heavy 100:1. Qual è la leva principale?", a:`<p><b>Cache + lookup per chiave indicizzato</b></p><p>Il redirect è un lookup del codice (chiave primaria/indice): la cache serve la stragrande maggioranza delle letture.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-tinyurl.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Perché usare un redirect 302 invece di 301?", a:`<p><b>Ogni click passa dal tuo server → puoi contare i click e cambiare destinazione</b></p><p>Il 301 viene cacheato da browser/CDN (meno carico ma non vedi i click). Il 302 fa passare ogni click da te.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-tinyurl.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Milioni di autisti, «trova il più vicino». Struttura chiave?", a:`<p><b>Indice spaziale (geohash/quadtree)</b></p><p>Cerchi per posizione, non per testo: un indice spaziale ti fa guardare solo la cella dell'utente e le adiacenti, non tutti.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-uber.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Dove tieni le posizioni che cambiano ogni pochi secondi?", a:`<p><b>In memoria (Redis)</b></p><p>Milioni di update/secondo su disco sono impraticabili: i dati «caldi» di posizione vivono in RAM.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-uber.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Come porti i video vicino a miliardi di utenti nel mondo?", a:`<p><b>CDN con edge + caching</b></p><p>Read-heavy e pesante di banda: la CDN serve i byte dall'edge vicino all'utente, scaricando l'origine.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-netflix.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Quando conviene transcodificare tutti i bitrate in anticipo?", a:`<p><b>Per i titoli popolari</b></p><p>In anticipo per il catalogo popolare (avvio immediato); on-demand per le qualità rare della coda lunga, per risparmiare storage.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-netflix.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Due utenti comprano lo stesso posto nello stesso istante. Qual è la rete di sicurezza finale contro l'oversell?", a:`<p><b>Prenotazione con TTL + vincolo UNIQUE su seat_id nel DB</b></p><p>La prenotazione con TTL gestisce l'esperienza; l'UNIQUE su seat_id rende l'oversell fisicamente impossibile a livello di database.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-ticket.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Come reggi il picco di una vendita flash senza far crollare il DB?", a:`<p><b>Una coda/sala d'attesa che ammette N utenti al secondo</b></p><p>La sala d'attesa virtuale regola gli ingressi a un ritmo sostenibile: protegge il backend sul dato conteso ed è equa.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-ticket.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Il web è pieno di cicli. Cosa evita di girare in tondo all'infinito?", a:`<p><b>La deduplica delle URL (set / bloom filter)</b></p><p>Il set delle URL già viste fa scartare i link che riportano a pagine note (es. G→A): spezza i cicli.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-crawler.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"A miliardi di URL non tieni un set esatto in memoria. Cosa usi?", a:`<p><b>Un bloom filter</b></p><p>Il bloom filter dice «forse visto / sicuramente mai visto» in pochissimo spazio, con rari falsi positivi: compromesso spazio/precisione.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-crawler.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Un ordine attraversa più attori e passi nel tempo. Come lo modelli?", a:`<p><b>Una macchina a stati guidata da eventi</b></p><p>Vive nel tempo con transizioni precise e può fallire a ogni passo: la macchina a stati + eventi è il modello naturale.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-delivery.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Nessun corriere disponibile al momento dell'assegnazione. Cosa fai?", a:`<p><b>Retry asincrono allargando raggio/incentivo (compensazione)</b></p><p>Non bloccare mai l'ordine su una risorsa mancante: si riprova in asincrono, allargando il raggio, con compensazioni se serve.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-delivery.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Il server deve consegnare un messaggio appena arriva. Cosa usi?", a:`<p><b>Connessione persistente (WebSocket) + registro di instradamento</b></p><p>Il polling è in ritardo e spreca richieste. Il WebSocket permette al server di spingere; il registro dice a quale nodo instradare.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-chat.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"sd", q:"Un gruppo enorme (100k membri). Quale fan-out conviene?", a:`<p><b>In lettura per i gruppi enormi</b></p><p>Fan-out in scrittura va bene per chat/gruppi piccoli; per gruppi enormi conviene espandere ai membri in lettura, per non fare 100k scritture a messaggio.</p><div class="diagbox"><iframe src="lesson-app/public/diagrams/case-chat.html?embed=1" loading="lazy"></iframe></div>`},
{ t:"cr", q:"Qual è lo scopo principale della code review?", a:`<p><b>Condividere la responsabilità del codice, diffondere conoscenza e catturare problemi prima della produzione</b></p><p>Non è un esame né un giudizio sulla persona: è un meccanismo di qualità e apprendimento condiviso.</p>`},
{ t:"cr", q:"Quale lente ha la priorità più alta?", a:`<p><b>Correttezza e sicurezza: se sbagliano, il resto non conta</b></p><p>Un codice elegante ma sbagliato o insicuro è inutile. Prima che sia giusto e sicuro, poi il resto.</p>`},
{ t:"cr", q:"Cosa rende un commento di review efficace?", a:`<p><b>Specifico, propositivo, etichettato per severità (bloccante/nit) e centrato sul codice</b></p><p>Indicare il caso concreto, proporre la soluzione e dichiarare quanto è grave costruisce fiducia e velocizza.</p>`},
{ t:"cr", q:"Cosa significa etichettare un commento come «nit»?", a:`<p><b>È un dettaglio non bloccante: opzionale da sistemare</b></p><p>«nit» segnala «è piccolo»: senza l'etichetta ogni commento sembra bloccante e frustra chi riceve.</p>`},
{ t:"cr", q:"Riga: db.query(\"... WHERE code='\" + c + \"'\"). Qual è il problema più grave?", a:`<p><b>SQL injection: input utente concatenato nella query → usa query parametrizzate</b></p><p>Concatenare input non fidato in una query permette di iniettare SQL. La difesa è sempre la query parametrizzata.</p>`},
{ t:"cr", q:"Loggare utente.carta (numero di carta) è un problema perché…", a:`<p><b>È un dato sensibile: i log si conservano e indicizzano, mai metterci PII/segreti</b></p><p>I log finiscono in sistemi consultabili e conservati a lungo: dati sensibili lì sono una falla di sicurezza.</p>`},
{ t:"cr", q:"Qual è il fattore numero uno per una review efficace?", a:`<p><b>La dimensione del PR: piccolo si rivede bene, enorme diventa un «LGTM» cieco</b></p><p>Oltre un certo numero di righe l'attenzione crolla e i bug sfuggono. PR piccoli e sequenziali battono un mega-PR.</p>`},
{ t:"cr", q:"Cosa deve fare chi APRE il PR prima di chiedere review?", a:`<p><b>Auto-review, CI verde, descrizione col perché, niente segreti nel diff</b></p><p>Preparare bene il PR (piccolo, testato, spiegato) è metà del lavoro di review: rispetta il tempo del collega.</p>`},
{ t:"pm", q:"Qual è la differenza principale tra PM e PgM (Program Manager)?", a:`<p><b>Il PM decide COSA costruire e perché; il PgM coordina COME e QUANDO più iniziative arrivano insieme, senza decidere il cosa</b></p><p>Il PM possiede la direzione del prodotto; il PgM orchestra l'esecuzione cross-team verso una data, spesso su iniziative decise da altri.</p>`},
{ t:"pm", q:"Perché il PM in B2B SaaS «lavora per influenza»?", a:`<p><b>Perché non ha autorità formale su eng, design, sales o CS: deve allineare, non comandare</b></p><p>Nessun reparto risponde gerarchicamente al PM: il suo strumento è la chiarezza sul problema e sui dati, non un ordine dall'alto.</p>`},
{ t:"pm", q:"Perché «ti piacerebbe una funzione X?» è una domanda debole in un'intervista cliente?", a:`<p><b>È leading e ipotetica: quasi nessuno dice no a una feature gratis, e le persone sovrastimano l'uso futuro</b></p><p>Le domande buone ancorano a un comportamento passato reale, non a un'opinione su un futuro ipotetico.</p>`},
{ t:"pm", q:"Cosa cattura il framework Jobs-to-be-Done?", a:`<p><b>Situazione → motivazione → risultato atteso: cosa il cliente sta cercando di fare, non cosa dice di volere</b></p><p>JTBD sposta il focus dalla soluzione richiesta (spesso sbagliata) al progresso che il cliente sta cercando di ottenere.</p>`},
{ t:"pm", q:"Nella formula RICE, cosa succede al punteggio se l'Effort raddoppia a parità di resto?", a:`<p><b>Il punteggio si dimezza: Effort è al denominatore</b></p><p>RICE = (Reach × Impact × Confidence) / Effort: più sforzo serve, più il punteggio scende a parità di beneficio atteso.</p>`},
{ t:"pm", q:"Quando conviene MoSCoW invece di RICE?", a:`<p><b>Per allineare rapidamente e qualitativamente uno stakeholder su un singolo rilascio, senza il calcolo numerico di RICE</b></p><p>MoSCoW è più rapido e qualitativo: utile per conversazioni veloci su un singolo scope, non per confrontare un intero backlog eterogeneo.</p>`},
{ t:"pm", q:"Qual è la differenza chiave tra roadmap e backlog?", a:`<p><b>La roadmap è intento/priorità comunicati verso l'esterno (poche voci, now/next/later); il backlog è dettaglio esecutivo interno e granulare</b></p><p>Confonderli porta a promettere all'esterno il dettaglio volatile dello sprint planning, o a nascondere la direzione dietro un elenco tecnico.</p>`},
{ t:"pm", q:"Perché la stessa feature va «framed» diversamente per exec, eng, sales e cliente?", a:`<p><b>Perché ogni pubblico ha bisogno di un'informazione diversa (impatto business, dettaglio tecnico, cosa promettere, beneficio utente) sulla stessa cosa reale</b></p><p>Il framing non altera i fatti: enfatizza ciò che conta per chi ascolta. È diverso dal mentire, che cambierebbe i fatti stessi.</p>`},
{ t:"pm", q:"Cosa rende un problem statement forte in una PRD?", a:`<p><b>Un numero/dato che rende il problema falsificabile, non un'affermazione vaga come «miglioriamo l'onboarding»</b></p><p>Un problema con un numero (es. «62% non completa il setup entro 14gg») è verificabile e dice quando è stato risolto; uno vago no.</p>`},
{ t:"pm", q:"Cosa significa «la PRD è allineamento, non contratto»?", a:`<p><b>Si aggiorna quando emergono fatti nuovi, invece di difendere la versione originale per principio</b></p><p>Trattarla come un contratto rigido blocca l'apprendimento in corsa; trattarla come alleata dell'allineamento la rende uno strumento vivo.</p>`},
{ t:"pm", q:"Un'azienda ha NRR = 115%. Cosa significa?", a:`<p><b>Il MRR dei clienti esistenti cresce del 15% anche a zero nuovi clienti, grazie all'expansion che supera contraction+churn</b></p><p>NRR guarda solo la coorte esistente: sopra 100% l'azienda si espande dall'interno, indipendentemente dai nuovi clienti acquisiti.</p>`},
{ t:"pm", q:"Un LTV:CAC di 0.7 cosa indica?", a:`<p><b>L'azienda perde soldi su ogni cliente acquisito: il valore atteso nel tempo è inferiore al costo di acquisizione</b></p><p>Sotto 1, ogni vendita costa più di quanto renderà: un segnale di allarme sull'unit economics, non solo un problema di volume.</p>`},
{ t:"pm", q:"Cosa manca a «Aumentare l'engagement degli utenti» per essere un buon Key Result?", a:`<p><b>Baseline, target numerico e scadenza: senza quelli non è misurabile né falsificabile</b></p><p>Un KR vero ha sempre un punto di partenza, un obiettivo numerico e un orizzonte temporale — altrimenti è un auspicio, non un risultato verificabile.</p>`},
{ t:"pm", q:"Perché «rilasciare 12 nuove feature» è una vanity metric come KR?", a:`<p><b>Perché misura l'output (quanto lavoro è stato fatto), non l'outcome (se è servito a qualcosa)</b></p><p>Si può centrare il target senza che cambi nulla per il cliente o il business: è la firma di una vanity metric.</p>`},
{ t:"pm", q:"Perché un A/B test su 40 account enterprise è rischioso da interpretare?", a:`<p><b>Perché con campioni così piccoli il potere statistico è basso: solo differenze molto grandi sono distinguibili dal rumore</b></p><p>Sotto poche centinaia di unità, piccole differenze osservate sono spesso casuali, non un vero effetto del cambiamento testato.</p>`},
{ t:"pm", q:"Cosa si può fare al posto di un A/B test quando il traffico è troppo basso?", a:`<p><b>Sequential rollout con metriche guardrail, canary su pochi account, o interviste qualitative</b></p><p>Basso traffico richiede evidenza di tipo diverso — qualitativa o di rollout progressivo — non l'assenza di ogni verifica.</p>`},
{ t:"pm", q:"In una matrice RACI, cosa significa che una persona è «Consulted» su una decisione?", a:`<p><b>Va sentita PRIMA che la decisione sia presa, ma non decide lei</b></p><p>Consulted = input prima della decisione; Responsible esegue, Accountable decide e risponde, Informed viene avvisato dopo.</p>`},
{ t:"pm", q:"Sales vuole una feature custom per chiudere un deal, eng dice che romperebbe l'architettura. Cosa fa un buon PM?", a:`<p><b>Chiede dati: quanti altri prospect la vogliono, quanto costa in eng-weeks, c'è un workaround più economico</b></p><p>Un «no» credibile senza autorità formale si costruisce con dati su generalizzabilità e costo, non con un rifiuto secco o una promessa impulsiva.</p>`},
{ t:"pm", q:"Qual è il rischio principale del pricing usage-based in B2B?", a:`<p><b>La bolletta imprevedibile spaventa i CFO, che preferiscono budget fissi — spesso serve un minimo garantito</b></p><p>L'allineamento al valore consumato è un vantaggio, ma l'imprevedibilità del costo è una frizione reale nelle vendite enterprise.</p>`},
{ t:"pm", q:"Perché il pricing tiered «lascia soldi sul tavolo ai bordi degli scaglioni»?", a:`<p><b>Perché un cliente appena sopra la soglia paga uguale a uno molto più grande nello stesso scaglione, e i clienti vicini al limite «giocano» per restare sotto</b></p><p>La discretizzazione in scaglioni crea disallineamento ai margini: stesso prezzo per valore molto diverso, e un incentivo a restare artificialmente sotto la soglia.</p>`},
{ t:"pm", q:"Qual è il primo passo corretto davanti a un caso da colloquio PM tipo «come miglioreresti X»?", a:`<p><b>Chiarire l'obiettivo e la metrica di business dietro la domanda, prima di proporre qualunque soluzione</b></p><p>Lanciarsi sulle soluzioni prima di capire l'obiettivo è l'errore più comune nei case interview: mostra fretta, non giudizio.</p>`},
{ t:"pm", q:"Perché un candidato dovrebbe dichiarare esplicitamente cosa NON farà, nel caso?", a:`<p><b>Perché mostra che ha valutato i trade-off e non vede solo il lato positivo del proprio piano</b></p><p>Un piano senza trade-off dichiarati è un piano non ancora pensato a fondo: gli intervistatori lo notano subito.</p>`},
];

/* ---------------- state & logic ---------------- */
const LS_KEY = "backend-lesson-deck-v1";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { marks = {}; }

CARDS.forEach((c, i) => { c.id = c.t + "-" + i; });

let topic = "all";
let reviewOnly = false;
let order = CARDS.map((_, i) => i);
let pos = 0;
let flipped = false;

const $ = (id) => document.getElementById(id);

function pool() {
  return order
    .map((i) => CARDS[i])
    .filter((c) => (topic === "all" || c.t === topic) && (!reviewOnly || marks[c.id] === "again"));
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(marks)); } catch (e) {} }

function renderChips() {
  const counts = { all: CARDS.length };
  for (const k of Object.keys(TOPICS)) counts[k] = CARDS.filter((c) => c.t === k).length;
  const again = CARDS.filter((c) => marks[c.id] === "again").length;
  const mk = (key, label, n, extra) =>
    `<button class="chip ${extra || ""} ${(!reviewOnly && topic === key) || (extra && reviewOnly) ? "on" : ""}"
      data-k="${key}" ${extra ? 'data-review="1"' : ""}>${label}<span class="n">${n}</span></button>`;
  $("chips").innerHTML =
    mk("all", "Tutte", counts.all) +
    Object.keys(TOPICS).map((k) => mk(k, TOPICS[k], counts[k])).join("") +
    mk("review", "Da ripassare", again, "review");
  $("chips").querySelectorAll(".chip").forEach((b) => {
    b.onclick = () => {
      if (b.dataset.review) { reviewOnly = !reviewOnly; }
      else { topic = b.dataset.k; reviewOnly = false; }
      pos = 0; flipped = false; render();
    };
  });
}

function renderProgress() {
  const p = pool();
  const scope = (topic === "all" && !reviewOnly) ? CARDS : p;
  const known = scope.filter((c) => marks[c.id] === "ok").length;
  $("prognum").textContent = known + " / " + scope.length + " known";
  $("barfill").style.width = scope.length ? (100 * known / scope.length) + "%" : "0%";
}

function render() {
  renderChips();
  renderProgress();
  const p = pool();
  const box = $("cardbox"), empty = $("empty");
  if (!p.length) { box.hidden = true; empty.hidden = false; return; }
  box.hidden = false; empty.hidden = true;
  if (pos >= p.length) pos = 0;
  const c = p[pos];
  const dot = marks[c.id] ? `<span class="mark-dot ${marks[c.id]}"></span>` : "";
  const idx = (pos + 1) + " / " + p.length;
  $("ftag").textContent = TOPICS[c.t];
  $("btag").textContent = TOPICS[c.t];
  $("fidx").innerHTML = dot + idx;
  $("bidx").innerHTML = dot + idx;
  $("fq").textContent = c.q;
  $("ba").innerHTML = c.a;
  box.classList.toggle("flipped", flipped);
  $("prev").disabled = pos === 0;
  $("next").disabled = pos === p.length - 1;
}

function flip() { flipped = !flipped; $("cardbox").classList.toggle("flipped", flipped); }
function step(d) {
  const p = pool();
  const np = pos + d;
  if (np < 0 || np >= p.length) return;
  pos = np; flipped = false; render();
}
function mark(v) {
  const p = pool();
  if (!p.length) return;
  marks[p[pos].id] = v; save();
  if (pos < p.length - 1) { pos++; flipped = false; }
  render();
}

$("flip").onclick = flip;
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("markok").onclick = () => mark("ok");
$("markagain").onclick = () => mark("again");
$("shuffle").onclick = () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0; flipped = false; render();
};
$("cardbox").onclick = (e) => { if (!window.getSelection().toString()) flip(); };
$("cardbox").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); flip(); } };

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === " ") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "1") mark("again");
  else if (e.key === "2") mark("ok");
});

render();
</script>
